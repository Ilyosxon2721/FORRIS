<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" fill="none">
  <!-- Outer square frame -->
  <rect x="2" y="2" width="76" height="76" rx="2" stroke="white" stroke-width="3.5" fill="none"/>

  <!-- F monogram inside square - matching the geometric design -->
  <!-- Main vertical bar of F -->
  <rect x="18" y="16" width="12" height="48" fill="white"/>
  <!-- Top horizontal bar of F -->
  <rect x="18" y="16" width="42" height="12" fill="white"/>
  <!-- Middle horizontal bar of F (shorter) -->
  <rect x="18" y="34" width="28" height="10" fill="white"/>

  <!-- FORRIS wordmark -->
  <text x="102" y="57" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="48" letter-spacing="7" fill="white">FORRIS</text>
</svg>
